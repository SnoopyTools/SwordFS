name: Build SwordFS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen and ldid
        run: |
          brew install xcodegen ldid

      - name: Build (unsigned)
        run: |
          xcodegen --spec project.yml
          xcodebuild -project SwordFS.xcodeproj \
            -scheme SwordFS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            clean build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Fake-sign with ldid + entitlements
        run: |
          APP="build/Build/Products/Release-iphoneos/SwordFS.app"
          ldid -SSwordFS/SwordFS.entitlements "$APP/SwordFS"

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r "build/Build/Products/Release-iphoneos/SwordFS.app" build/Payload/
          (cd build && zip -qry SwordFS.ipa Payload)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwordFS-ipa
          path: build/SwordFS.ipa