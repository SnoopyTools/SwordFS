name: SwordFS
options:
  bundleIdPrefix: dev.sword
  deploymentTarget:
    iOS: "18.1"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_OBJC_ARC: YES
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.1"
    ENABLE_BITCODE: NO
    OTHER_LDFLAGS: "$(inherited) -lsandbox"
    GCC_C_LANGUAGE_STANDARD: gnu17
    SWIFT_OBJC_BRIDGING_HEADER: SwordFS/SwordFS-Bridging-Header.h
    CLANG_WARN_DOCUMENTATION_COMMENTS: NO
    SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  SwordFS:
    type: application
    platform: iOS
    sources:
      - path: SwordFS
    info:
      path: SwordFS/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sword.swordfs
        PRODUCT_NAME: SwordFS
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: SwordFS/Info.plist
        CODE_SIGN_ENTITLEMENTS: SwordFS/SwordFS.entitlements
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SDKROOT)/System/Library/PrivateFrameworks"
    dependencies:
      - sdk: IOSurface.framework
      - sdk: IOKit.framework
